[package]
name = "hashfilter"
version = "0.2.0"
authors = ["Thomas Hurst <tom@hur.st>", "Cirqup <skankpaw@disroot.org>"]
edition = "2024"
rust-version = "1.96"
license = "MIT"

[dependencies]
siphasher = "1"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
pedantic = "warn"
style = "warn"
many_single_char_names = "warn"
min_ident_chars = "warn"
