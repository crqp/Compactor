[package]
name = "compactor"
version = "0.11.0"
authors = ["Thomas Hurst <tom@hur.st>", "Cirqup <skankpaw@disroot.org>"]
homepage = "https://github.com/Freaky/Compactor"
description = "An interface to Windows 10 filesystem compression"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[dependencies]
compresstimator = { git = "https://github.com/Freaky/compresstimator.git", rev = "030d112453bc24619e47f234bc566c1494b1590e" }
crossbeam-channel = "0.5"
ctrlc = "3.5"
directories = "6"
eframe = "0.36"
filetime = "0.2"
globset = "0.4"
hashfilter = { path = "hashfilter" }
humansize = "2.1"
image = { version = "0.25", default-features = false, features = ["ico"] }
rfd = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
siphasher = "1"
walkdir = "2.5"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[[bin]]
name = "Compactor"
path = "src/main.rs"

[build-dependencies]
vergen-gitcl = { version = "10", features = ["build"] }
winresource = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"

[lints.clippy]
pedantic = "warn"
style = "warn"
many_single_char_names = "warn"
min_ident_chars = "warn"

[workspace]
members = [
  "hashfilter"
]
